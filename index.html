    <script>
      // Decides before first paint whether the intro plays. No bundle is needed for it to run or be skipped.
      (function () {
        var root = document.documentElement;
        root.setAttribute('data-js', '');
        try {
          var motionOk = !matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (motionOk && !location.hash && !sessionStorage.getItem('arvon-intro-seen')) {
            root.setAttribute('data-intro', '');
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <!--logo-sprite-->
    <div id="intro" class="intro">
      <div class="intro__scrim"></div>
      <div class="intro__rig" aria-hidden="true">
        <div class="intro__plane intro__plane--a"></div>
        <div class="intro__plane intro__plane--b"></div>
      </div>
      <p class="intro__welcome">أهلًا وسهلًا بكم</p>
      <div class="intro__logo" aria-hidden="true"><!--intro-logo--></div>
      <button type="button" class="intro__skip">تخطي المقدمة</button>
    </div>
    <script>
      (function () {
        var root = document.documentElement;
        var intro = document.getElementById('intro');
        if (!root.hasAttribute('data-intro')) return;
        function end() {
          try {
            sessionStorage.setItem('arvon-intro-seen', '1');
          } catch (e) {}
          root.removeAttribute('data-intro');
          removeEventListener('wheel', end);
          removeEventListener('touchmove', end);
          removeEventListener('keydown', onKey);
        }
        function onKey(event) {
          if (event.key !== 'Tab' && event.key !== 'Shift') end();
        }
        intro.querySelector('button').addEventListener('click', end);
        intro.addEventListener('animationend', function (event) {
          if (event.target === intro) end();
        });
        addEventListener('wheel', end, { passive: true });
        addEventListener('touchmove', end, { passive: true });
        addEventListener('keydown', onKey);
      })();
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
